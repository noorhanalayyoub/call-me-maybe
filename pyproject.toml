[project]
name = 'call-me-maybe'
version = '0.0'
requires-python = '>=3.10'
dependencies = [
    'llm_sdk',
    'pydantic',
    'numpy',
    "accelerate>=1.15.0",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]

[tool.mypy]
exclude = ["^llm_sdk/"]
