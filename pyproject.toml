[project]
name = 'call-me-maybe'
version = '0.0'
description = 'LLM function-calling pipeline that selects functions and extracts parameters from prompts.'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = ['llm_sdk', 'pydantic>=2']

[project.scripts]
call-me-maybe = 'src.__main__:main'

[dependency-groups]
dev = ['pytest', 'pytest-cov', 'flake8', 'mypy']

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src']

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

[tool.mypy]
mypy_path = 'llm_sdk'
exclude = ['^llm_sdk/']

